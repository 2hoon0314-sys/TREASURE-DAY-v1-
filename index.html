<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREASURE DAY 💎</title>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>

<div id="splash">
  <div class="logo">💎</div>
  <h1>TREASURE DAY</h1>
  <p>Have a Treasure Day.</p>
</div>

<main id="app">

<header class="hero home-hero">

<!-- 📸 フォトギャラリー -->
<div class="home-photo-strip">
  <div class="home-photo-track">

    <div class="home-photo-card">
      <img src="weverse_20251106023034_3375579092.jpeg" alt="TREASURE PHOTO 1">
    </div>

    <div class="home-photo-card">
      <img src="weverse_20260116131428_671209511.jpeg" alt="TREASURE PHOTO 2">
    </div>

    <div class="home-photo-card">
      <img src="IMG_0804.jpeg" alt="TREASURE PHOTO 3">
    </div>

    <div class="home-photo-card">
      <img src="IMG_0809.jpeg" alt="TREASURE PHOTO 4">
    </div>

  <div class="home-photo-card">
    <img src="weverse_20251106023034_3375579092.jpeg">
  </div>

  <div class="home-photo-card">
    <img src="weverse_20260116131428_671209511.jpeg">
  </div>

  <div class="home-photo-card">
    <img src="IMG_0804.jpeg">
  </div>

  <div class="home-photo-card">
    <img src="IMG_0809.jpeg">
  </div>


</div>
  </div>
<!-- 💎 TREASURE LIGHT STICK -->
<img src="IMG_5684.png" class="home-lightstick" alt="TREASURE LIGHT STICK">
  <div class="my-treasure home-member-card">
    💎 MY TREASURE :
    <span id="home-member">JIHOON</span>
  </div>

  <!-- ⏳ TREASURE DAY COUNTDOWN -->
  <div class="treasure-countdown home-countdown">
    <span>💎 TREASURE DAY</span>
    <strong id="treasure-countdown">D-</strong>
  </div>

  <!-- 📅 NEXT EVENT -->
  <div class="home-next-event">
    <p class="label">NEXT EVENT</p>

    <div class="event-card home-event-card">
      <h1 id="home-event-name">THE STAGE</h1>

      <p id="home-event-place">📍 IGアリーナ</p>

      <p id="home-event-date">📅 2026.08.01</p>

      <div class="dday" id="dday">
        D-DAY
      </div>
      
<!-- 🌼 JIHOON TRUZ -->
<img src="IMG_5683.png" class="jihoon-truz" alt="JIHOON TRUZ">      

    </div>
  </div>

</header>



</main>
<section id="plan-page" class="page" style="display:none;">

<div class="card">

  <h2>📅 PLAN</h2>

  <div class="plan-form">

    <input
      id="plan-name"
      class="input"
      type="text"
      placeholder="イベント名 💎"
    >

    <input
      id="plan-place"
      class="input"
      type="text"
      placeholder="会場 📍"
    >

    <input
      id="plan-date"
      class="input"
      type="date"
    >

    <button id="add-plan-btn">
      ＋ イベントを追加
    </button>
<button id="past-events-btn" type="button">
  📚 過去のイベントを見る
</button>
  </div>

  <div id="plan-list"></div>

</div>
</section>  
  <!-- 📚 PAST EVENTS PAGE -->
<section id="past-events-page" class="page" style="display:none;">
  <div class="card">

    <h2>📚 PAST EVENTS</h2>

    <button id="back-to-plan-btn" type="button">
      ← PLANに戻る
    </button>

    <div id="past-events-list"></div>

  </div>
</section>
 <section id="memory-page" class="page" style="display:none;">

<div class="card memory-inner">

        <h2>📸 MEMORY</h2>

        <input
            id="memory-title"
            class="input"
            placeholder="タイトル">

        <textarea
            id="memory-text"
            class="input"
            placeholder="思い出を書こう✨"
            rows="5"></textarea>
<label class="memory-photo-label">
  📸 写真を追加
  <input
    type="file"
    id="memory-photo"
    accept="image/*"
  >
</label>
        <button id="save-memory" class="primary-btn">
            保存💎
        </button>

    </div>

    <div class="card">

<h2 class="memory-saved-title">保存したMEMORY</h2>

        <div id="memory-list"></div>

    </div>

</section> 
  <section id="settings-page" class="page" style="display:none;">

  <div class="card">

    <h2>⚙️ SETTINGS</h2>

<div class="plan-item member-setting">
  <span>👤 推しメン設定</span>

  <select id="member-select">
    <option value="">選択してね💎</option>
    <option value="HYUNSUK">HYUNSUK</option>
    <option value="JIHOON">JIHOON</option>
    <option value="YOSHI">YOSHI</option>
    <option value="JUNKYU">JUNKYU</option>
    <option value="YOON JAEHYUK">YOON JAEHYUK</option>
    <option value="ASAHI">ASAHI</option>
    <option value="DOYOUNG">DOYOUNG</option>
    <option value="HARUTO">HARUTO</option>
    <option value="PARK JEONGWOO">PARK JEONGWOO</option>
    <option value="SO JUNGHWAN">SO JUNGHWAN</option>
  </select>
</div>

<div class="plan-item treasure-day-setting">
  <span>💎 TREASURE DAY設定</span>

  <input
    type="date"
    id="treasure-day-input"
  >
</div>

  <div class="plan-item">
  <span>🎨 テーマ設定</span>
  <button id="theme-toggle" class="primary-btn">LIGHT MODE</button>
</div>

    <div class="plan-item">
      🔔 通知設定
    </div>

    <div class="plan-item">
      📱 アプリ情報
    </div>

  </div>

</section>
<nav class="bottom-nav">

<button class="nav-btn active" id="home-tab">
    <span>🏠</span>
    <small>HOME</small>
  </button>

  <button class="nav-btn" id="plan-tab">
    <span>📅</span>
    <small>PLAN</small>
  </button>

<button class="nav-btn" id="memory-tab">  
    <span>📸</span>
    <small>MEMORY</small>
  </button>

<button class="nav-btn" id="settings-tab">
  <span>⚙️</span>
  <small>SETTINGS</small>
</button>
</nav>

<script src="app.js?v=11"></script>

</body>
</html>
