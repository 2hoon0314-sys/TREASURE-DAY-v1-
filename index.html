<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREASURE DAY 💎</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="splash">
  <div class="logo">💎</div>
  <h1>TREASURE DAY</h1>
  <p>Have a Treasure Day.</p>
</div>

<main id="app">

  <header class="hero">
<div class="my-treasure">
  💎 MY TREASURE：<span id="home-member">JIHOON</span>
</div>
    <div class="treasure-countdown">
  <span>💎 TREASURE DAY</span>
  <strong id="treasure-countdown">D-</strong>
</div>
    <p class="label">NEXT EVENT</p>

    <div class="event-card">

<h1 id="home-event-name">THE STAGE</h1>

<p id="home-event-place">IGアリーナ</p>

<p id="home-event-date">2026.08.01</p>
      <div class="dday" id="dday">
        D-DAY
      </div>

    </div>

  </header>

  <section class="card">

    <h2>🎒 持ち物</h2>
<div class="actions">

<button id="check-all">

全部チェック

</button>

<button id="clear-all">

リセット

</button>

</div>
    <div class="progress">
      <div id="progress-bar"></div>
    </div>

    <p class="percent">0%</p>
<div class="add-item">

  <input
    type="text"
    id="new-item"
    placeholder="持ち物を追加">

  <button id="add-item-btn">
    追加
  </button>

</div>
    <div id="checklist"></div>

  </section>

</main>
<section id="plan-page" class="page" style="display:none;">

<div class="card">

  <h2>📅 PLAN</h2>

  <div class="plan-form">

    <input
      id="plan-name"
      class="input"
      type="text"
      placeholder="イベント名 💎"
    >

    <input
      id="plan-place"
      class="input"
      type="text"
      placeholder="会場 📍"
    >

    <input
      id="plan-date"
      class="input"
      type="date"
    >

    <button id="add-plan-btn">
      ＋ イベントを追加
    </button>

  </div>

  <div id="plan-list"></div>

</div>
</section>  
 <section id="memory-page" class="page" style="display:none;">

    <div class="card">

        <h2>📸 MEMORY</h2>

        <input
            id="memory-title"
            class="input"
            placeholder="タイトル">

        <textarea
            id="memory-text"
            class="input"
            placeholder="思い出を書こう✨"
            rows="5"></textarea>

        <button id="save-memory" class="primary-btn">
            保存💎
        </button>

    </div>

    <div class="card">

        <h2>保存したMEMORY</h2>

        <div id="memory-list"></div>

    </div>

</section> 
  <section id="settings-page" class="page" style="display:none;">

  <div class="card">

    <h2>⚙️ SETTINGS</h2>

<div class="plan-item member-setting">
  <span>👤 推しメン設定</span>

  <select id="member-select">
    <option value="">選択してね💎</option>
    <option value="HYUNSUK">HYUNSUK</option>
    <option value="JIHOON">JIHOON</option>
    <option value="YOSHI">YOSHI</option>
    <option value="JUNKYU">JUNKYU</option>
    <option value="YOON JAEHYUK">YOON JAEHYUK</option>
    <option value="ASAHI">ASAHI</option>
    <option value="DOYOUNG">DOYOUNG</option>
    <option value="HARUTO">HARUTO</option>
    <option value="PARK JEONGWOO">PARK JEONGWOO</option>
    <option value="SO JUNGHWAN">SO JUNGHWAN</option>
  </select>
</div>

<div class="plan-item treasure-day-setting">
  <span>💎 TREASURE DAY設定</span>

  <input
    type="date"
    id="treasure-day-input"
  >
</div>

  <div class="plan-item">
  <span>🎨 テーマ設定</span>
  <button id="theme-toggle" class="primary-btn">LIGHT MODE</button>
</div>

    <div class="plan-item">
      🔔 通知設定
    </div>

    <div class="plan-item">
      📱 アプリ情報
    </div>

  </div>

</section>
<nav class="bottom-nav">

<button class="nav-btn active" id="home-tab">
    <span>🏠</span>
    <small>HOME</small>
  </button>

  <button class="nav-btn" id="plan-tab">
    <span>📅</span>
    <small>PLAN</small>
  </button>

<button class="nav-btn" id="memory-tab">  
    <span>📸</span>
    <small>MEMORY</small>
  </button>

<button class="nav-btn" id="settings-tab">
  <span>⚙️</span>
  <small>SETTINGS</small>
</button>
</nav>

<script src="app.js?v=3"></script>

</body>
</html>
