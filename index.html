<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREASURE DAY 💎</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <div class="logo">💎</div>
  <h1>TREASURE DAY</h1>
  <p>Have a Treasure Day.</p>
</div>

<main id="app">

  <header class="hero">

    <p class="label">NEXT EVENT</p>

    <div class="event-card">

      <h1>THE STAGE</h1>

      <p>IGアリーナ</p>

      <p>2026.08.01</p>

      <div class="dday" id="dday">
        D-DAY
      </div>

    </div>

  </header>

  <section class="card">

    <h2>🎒 持ち物</h2>
<div class="actions">

<button id="check-all">

全部チェック

</button>

<button id="clear-all">

リセット

</button>

</div>
    <div class="progress">
      <div id="progress-bar"></div>
    </div>

    <p class="percent">0%</p>
<div class="add-item">

  <input
    type="text"
    id="new-item"
    placeholder="持ち物を追加">

  <button id="add-item-btn">
    追加
  </button>

</div>
    <div id="checklist"></div>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
